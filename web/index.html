<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hotelero</title>
    <link rel="stylesheet" href="estilos.css?v=2">
</head>
<body>

    <header>
        <div class="encabezado">
            <span class="logo">♔</span>
            <div>
                <h1>Sistema Hotelero</h1>
                <p>Gestión de habitaciones y reservas</p>
            </div>
        </div>
    </header>

    <main>

        <section class="panel-habitaciones">
            <h2>Estado de habitaciones</h2>
            <div id="habitaciones"></div>
        </section>

        <section class="panel-reserva">

            <h2>Realizar reserva</h2>

            <form id="formulario">

                <label>Nombre completo</label>
                <input type="text" name="nombre"
                       placeholder="Ingrese su nombre completo" required>

                <label>Identificación</label>
                <input type="text" name="identificacion"
                       placeholder="Ingrese su identificación" required>

                <label>Correo electrónico</label>
                <input type="email" name="correo"
                       placeholder="Ingrese su correo electrónico" required>

                <label>Teléfono</label>
                <input type="tel" name="numero"
                       placeholder="Ingrese su teléfono" required>

                <label>Tipo de habitación</label>
                <select name="tipo" required>
                    <option value="">Seleccione una habitación</option>
                    <option value="Individual">Individual</option>
                    <option value="Doble">Doble</option>
                    <option value="Familiar">Familiar</option>
                </select>

                <div class="fechas">
                    <div>
                        <label>Fecha de entrada</label>
                        <input type="date" name="entrada" required>
                    </div>

                    <div>
                        <label>Fecha de salida</label>
                        <input type="date" name="salida" required>
                    </div>
                </div>

                <button type="submit">Realizar reserva</button>

            </form>

            <p id="mensaje"></p>

        </section>

    </main>

    <footer>
        <h2>Proyecto final POO</h2>
        <p>Hecho por Lisbeth Torres y Karen Forero</p>
    </footer>

    <script src="script.js?v=2"></script>

</body>
</html>
